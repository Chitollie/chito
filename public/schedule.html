<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chitollie — Planning</title>
  <link rel="icon" type="image/x-icon" href="logo.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Playfair+Display:ital@1&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f0eaf8;
      --bg2:      #e8dff5;
      --paper:    #faf7fd;
      --ink:      #3b2d5a;
      --dim:      rgba(59,45,90,0.45);
      --accent:   #9b6fd4;
      --accent2:  #c89be0;
      --soft:     #d4b8f0;
      --pink:     #f0b8d8;
      --mint:     #b8e8d4;
      --line:     rgba(155,111,212,0.18);
      --card:     rgba(255,255,255,0.65);
      --gaming:   #00d4ff;
    }

    body { cursor: none; }
    #cursor {
      position: fixed;
      width: 12px; height: 12px;
      background: var(--accent);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.25s, height 0.25s, background 0.25s;
    }
    #cursor.hover {
      width: 32px; height: 32px;
      background: var(--soft);
      opacity: 0.7;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Nunito', sans-serif;
      font-weight: 400;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 55% 45% at 10% 15%, rgba(200,155,224,0.22) 0%, transparent 70%),
        radial-gradient(ellipse 40% 50% at 90% 80%, rgba(184,232,212,0.18) 0%, transparent 65%),
        radial-gradient(ellipse 35% 40% at 80% 10%, rgba(247,216,160,0.15) 0%, transparent 60%),
        radial-gradient(ellipse 30% 35% at 20% 85%, rgba(240,184,216,0.15) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 56px 1fr;
      grid-template-rows: 1fr auto;
    }

    .sidebar {
      grid-row: 1 / 3;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 0;
      gap: 1.5rem;
      position: sticky;
      top: 0;
      height: 100vh;
      background: rgba(240,234,248,0.6);
      backdrop-filter: blur(8px);
    }
    .sidebar-logo {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      color: var(--accent2);
    }
    .sidebar-line { flex: 1; width: 1px; background: var(--line); }
    .sidebar-index { font-size: 0.55rem; letter-spacing: 0.1em; color: var(--dim); }

    main {
      padding: 2.5rem 4.5rem 2rem 4rem;
      display: flex;
      flex-direction: column;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6vw;
      animation: fadeIn 0.5s ease both;
    }
    .back-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dim);
      transition: color 0.2s;
    }
    .back-btn:hover { color: var(--accent); }
    .nav-tag { font-size: 0.65rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim); }

    .hero { flex: 0.6; display: flex; flex-direction: column; justify-content: center; }
    .hero-eyebrow {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--accent2);
      margin-bottom: 0.5rem;
      animation: fadeIn 0.5s 0.1s ease both;
    }
    .hero-name {
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      line-height: 0.9;
      color: var(--ink);
      animation: slideUp 0.75s 0.12s cubic-bezier(0.16,1,0.3,1) both;
    }
    .hero-sub {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(0.9rem, 1.6vw, 1.1rem);
      color: var(--dim);
      margin-top: 1rem;
      animation: fadeIn 0.5s 0.3s ease both;
    }

    .schedule-block {
      margin-top: clamp(1.5rem, 3vw, 2.5rem);
      animation: fadeIn 0.5s 0.45s ease both;
    }
    .col-label {
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent2);
      margin-bottom: 1.2rem;
    }

    .streams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1.2rem;
    }

    .stream-card {
      background: var(--card);
      backdrop-filter: blur(8px);
      border: 1px solid var(--line);
      padding: 1.4rem;
      border-radius: 8px;
      transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
      position: relative;
      overflow: hidden;
    }

    .stream-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--gaming), var(--accent), var(--soft));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s cubic-bezier(0.16,1,0.3,1);
    }

    .stream-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 12px 24px rgba(155,111,212,0.15);
    }

    .stream-card:hover::before {
      transform: scaleX(1);
    }

    .stream-day {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gaming);
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .stream-day::before {
      content: '▌';
      font-size: 0.6rem;
      animation: pulse 2s ease-in-out infinite;
    }

    .stream-time {
      font-family: 'Nunito', sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.2rem);
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 0.4rem;
      letter-spacing: -0.02em;
    }

    .stream-status {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--dim);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.8rem;
      padding-top: 0.8rem;
      border-top: 1px solid var(--line);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gaming);
      animation: blink 1.5s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @keyframes fadeIn  { from { opacity:0; } to { opacity:1; } }
    @keyframes slideUp { from { opacity:0; transform:translateY(28px); } to { opacity:1; transform:translateY(0); } }

    footer {
      padding: 1.4rem 4rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--line);
      animation: fadeIn 0.5s 0.55s ease both;
    }
    footer span { font-size: 0.58rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); }

    @media (max-width: 620px) {
      .page { grid-template-columns: 38px 1fr; }
      main { padding: 2rem 1.6rem 1.5rem; }
      .streams-grid { grid-template-columns: 1fr; }
      nav { margin-bottom: 2.5rem; }
      footer { padding: 1rem 1.6rem; }
    }
  </style>
</head>
<body>
  <div id="cursor"></div>

  <div class="page">
    <aside class="sidebar">
      <span class="sidebar-logo">Chitollie</span>
      <div class="sidebar-line"></div>
      <span class="sidebar-index">03</span>
    </aside>

    <main>
      <nav>
        <a href="index.html" class="back-btn">← Retour</a>
        <span class="nav-tag">Planning</span>
      </nav>

      <section class="hero">
        <p class="hero-eyebrow">⏱ La suite des aventures</p>
        <h1 class="hero-name">Planning</h1>
        <p class="hero-sub">Retrouvez-moi sur Twitch à ces horaires magiques.</p>
      </section>

      <div class="schedule-block">
        <p class="col-label">✦ Streams en direct</p>
        <div class="streams-grid">
          <div class="stream-card">
            <div class="stream-day">Mercredi</div>
            <div class="stream-time">20h</div>
            <div class="stream-status">
              <span class="status-dot"></span>
              En direct
            </div>
          </div>

          <div class="stream-card">
            <div class="stream-day">Vendredi</div>
            <div class="stream-time">20h</div>
            <div class="stream-status">
              <span class="status-dot"></span>
              En direct
            </div>
          </div>

          <div class="stream-card">
            <div class="stream-day">Samedi</div>
            <div class="stream-time">18h</div>
            <div class="stream-status">
              <span class="status-dot"></span>
              En direct
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <span>© 2026 Chitollie</span>
      <span>Streamer · Créateur</span>
    </footer>
  </div>

  <script>
    const c = document.getElementById('cursor');
    document.addEventListener('mousemove', e => {
      c.style.left = e.clientX + 'px';
      c.style.top  = e.clientY + 'px';
    });
    document.querySelectorAll('a').forEach(el => {
      el.addEventListener('mouseenter', () => c.classList.add('hover'));
      el.addEventListener('mouseleave', () => c.classList.remove('hover'));
    });
  </script>
</body>
</html>
